name: Update ordinance data

on:
  schedule:
    - cron: '0 0 1,16 * *'   # 매월 1일, 16일 00:00 UTC (한국 09:00)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run collect script
        run: python3 scripts/collect.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ordinances.json
          git diff --cached --quiet || git commit -m "chore: update ordinance data ($(date '+%Y-%m-%d'))"
          git push
